<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Entrenador de Seguridad Web</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --card-bg: #16213e;
            --primary: #4ecca3;
            --text: #e94560;
            --white: #ffffff;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--white); padding: 20px; text-align: center; }
        .container { max-width: 900px; margin: auto; }
        
        .score-board { background: var(--card-bg); padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid var(--primary); }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        
        .card { 
            background: var(--card-bg); border-radius: 15px; padding: 25px; 
            min-height: 200px; display: flex; flex-direction: column; justify-content: center;
            cursor: pointer; transition: 0.4s; border: 2px solid transparent;
            position: relative; overflow: hidden;
        }
        
        .card.hidden h2 { filter: blur(5px); opacity: 0.3; }
        .card.hidden .content { display: none; }
        
        .card.revealed { border-color: var(--primary); }
        .card.revealed h2 { filter: blur(0); opacity: 1; color: var(--primary); }
        
        .content { margin-top: 15px; font-size: 0.9rem; text-align: left; animation: fadeIn 0.5s; }
        
        .actions { display: none; margin-top: 20px; gap: 10px; justify-content: center; }
        .card.revealed .actions { display: flex; }

        button { 
            padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; 
            font-weight: bold; transition: 0.2s;
        }
        .btn-know { background: #27ae60; color: white; }
        .btn-not-know { background: #c0392b; color: white; }
        .btn-reset { background: var(--text); color: white; margin-top: 20px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .status-tag { position: absolute; top: 10px; right: 10px; font-size: 0.7rem; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>Flashcards: Seguridad Web</h1>
    <p>Haz clic en una tarjeta para revelar el concepto. ¿Lo sabías?</p>

    <div class="score-board">
        Conceptos dominados: <span id="count">0</span> / 9
    </div>

    <div class="grid" id="gameGrid"></div>

    <button class="btn-reset" onclick="resetGame()">Reiniciar Repaso</button>
</div>

<script>
    const data = [
        { t: "Algoritmos Públicos", d: "Seguridad basada en el secreto de la llave, no del método (Kerckhoffs). Permite que expertos busquen fallos." },
        { t: "Cifrado Simétrico", d: "Una sola llave para todo. Rápido y eficiente. Ej: AES. El reto es cómo enviar la llave." },
        { t: "Cifrado Asimétrico", d: "Par de llaves (Pública/Privada). Lo que una cifra, la otra descifra. Ej: RSA/ECC. Resuelve el intercambio de llaves." },
        { t: "Algoritmos de Hash", d: "Huellas digitales únicas y unidireccionales de un archivo. Si cambia el archivo, cambia el hash. Ej: SHA-256." },
        { t: "Firma Digital", d: "Hash cifrado con llave privada. Garantiza que el mensaje es auténtico y no ha sido alterado." },
        { t: "Formato X.509", d: "Estándar internacional que define qué datos lleva un certificado (titular, CA, clave pública, etc.)." },
        { t: "Certificados Raíz", d: "Certificados de autoridades máximas preinstalados en el PC. Son la base de la cadena de confianza." },
        { t: "SSL / TLS", d: "Protocolos que crean el túnel seguro. TLS es el actual. HTTPS usa TLS para proteger los datos de la web." },
        { t: "Handshake HTTPS", d: "Negociación: Hello -> Envío Certificado -> Validación -> Acuerdo de llave simétrica -> Sesión segura." }
    ];

    let mastered = new Set();

    function render() {
        const grid = document.getElementById('gameGrid');
        grid.innerHTML = data.map((item, i) => `
            <div class="card ${mastered.has(i) ? 'revealed' : 'hidden'}" id="card-${i}" onclick="reveal(${i})">
                <div class="status-tag">${mastered.has(i) ? '✅ APRENDIDO' : '❓ OCULTO'}</div>
                <h2>${item.t}</h2>
                <div class="content">
                    ${item.d}
                    <div class="actions">
                        <button class="btn-know" onclick="mark(${i}, true; event)">Lo sabía</button>
                        <button class="btn-not-know" onclick="mark(${i}, false; event)">No lo sabía</button>
                    </div>
                </div>
            </div>
        `).join('');
        document.getElementById('count').innerText = mastered.size;
    }

    window.reveal = function(i) {
        document.getElementById(`card-${i}`).classList.remove('hidden');
        document.getElementById(`card-${i}`).classList.add('revealed');
    }

    window.mark = function(i, knows, event) {
        event.stopPropagation();
        if(knows) {
            mastered.add(i);
        } else {
            mastered.delete(i);
            document.getElementById(`card-${i}`).classList.add('hidden');
            document.getElementById(`card-${i}`).classList.remove('revealed');
        }
        render();
    }

    window.resetGame = function() {
        mastered.clear();
        render();
    }

    render();
</script>

</body>
</html>
