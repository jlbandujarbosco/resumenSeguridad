<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Seguridad Web y Criptografía</title>
    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #2c3e50;
            --accent-color: #2ecc71;
            --danger-color: #e74c3c;
            --text-color: #333;
            --bg-light: #f4f7f6;
            --bg-dark: #ecf0f1;
            --card-bg: #ffffff;
            --border-color: #ddd;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .quiz-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 800px;
            width: 100%;
            margin: 30px 0;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: var(--secondary-color);
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.2em;
        }

        .question-section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--bg-dark);
        }

        .question-number {
            font-size: 1.1em;
            color: var(--primary-color);
            font-weight: bold;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 1.3em;
            margin-bottom: 20px;
            color: var(--secondary-color);
            font-weight: 500;
        }

        .options-container label {
            display: block;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.05em;
        }

        .options-container label:hover {
            background-color: #eef1f3;
            border-color: var(--primary-color);
        }

        .options-container input[type="radio"] {
            margin-right: 12px;
            transform: scale(1.2);
        }

        .options-container label.selected {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px var(--primary-color);
        }

        .options-container label.correct {
            background-color: #e6ffe6; /* Light green */
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px var(--accent-color);
        }

        .options-container label.incorrect {
            background-color: #ffe6e6; /* Light red */
            border-color: var(--danger-color);
            box-shadow: 0 0 0 2px var(--danger-color);
        }

        .feedback-section {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 1em;
        }

        .feedback-section.correct {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .feedback-section.incorrect {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .feedback-section strong {
            display: block;
            margin-bottom: 8px;
        }

        .hint {
            margin-top: 15px;
            font-size: 0.9em;
            color: #666;
            font-style: italic;
        }

        .navigation-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
        }

        .navigation-buttons button {
            padding: 12px 25px;
            font-size: 1.1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .navigation-buttons button:hover {
            transform: translateY(-2px);
        }

        #prevButton {
            background-color: var(--secondary-color);
            color: var(--card-bg);
        }
        #prevButton:hover {
            background-color: #212d3b;
        }

        #nextButton, #submitQuiz {
            background-color: var(--primary-color);
            color: var(--card-bg);
        }
        #nextButton:hover, #submitQuiz:hover {
            background-color: #2980b9;
        }

        #submitQuiz {
            display: none; /* Hidden until last question */
            width: 100%;
            margin-top: 20px;
        }

        .result-section {
            text-align: center;
            margin-top: 40px;
        }

        .result-section h2 {
            color: var(--accent-color);
            font-size: 2.5em;
            margin-bottom: 15px;
        }

        .result-section p {
            font-size: 1.2em;
            margin-bottom: 20px;
        }

        #restartQuiz {
            background-color: var(--primary-color);
            color: var(--card-bg);
            padding: 12px 25px;
            font-size: 1.1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        #restartQuiz:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>Quiz: Seguridad Web y Criptografía</h1>

    <div id="quiz-screen">
        <div class="question-section" id="questionSection">
            </div>

        <div class="navigation-buttons">
            <button id="prevButton" onclick="prevQuestion()" disabled>Anterior</button>
            <button id="nextButton" onclick="nextQuestion()">Siguiente</button>
        </div>
        <button id="submitQuiz" onclick="submitQuiz()">Finalizar Quiz</button>
    </div>

    <div id="result-screen" style="display: none;">
        <div class="result-section">
            <h2>¡Quiz Finalizado!</h2>
            <p>Has obtenido <span id="scoreDisplay">0</span> de <span id="totalQuestionsDisplay">0</span> puntos.</p>
            <button id="restartQuiz" onclick="restartQuiz()">Reiniciar Quiz</button>
        </div>
    </div>
</div>

<script>
    const quizData = [
        {
            questionNumber: 1,
            question: "¿Cuál es la principal razón por la que los algoritmos de cifrado modernos como AES o RSA son públicos?",
            answerOptions: [
                { text: "Para que cualquier usuario pueda modificarlos y crear su propia versión personalizada.", isCorrect: false },
                { text: "Para permitir que la comunidad de expertos los audite y asegure que no tienen vulnerabilidades ocultas.", isCorrect: true },
                { text: "Porque las leyes internacionales prohíben el uso de algoritmos de cifrado secretos o privados.", isCorrect: false },
                { text: "Para que los hackers sepan cómo atacarlos y así la tecnología pueda avanzar más rápido.", isCorrect: false }
            ],
            rationale: "El principio de Kerckhoffs establece que la seguridad reside en la clave, y ser público permite que miles de expertos validen su robustez.",
            hint: "Piensa en el principio de Kerckhoffs y en la importancia de la revisión por pares en ciberseguridad."
        },
        {
            questionNumber: 2,
            question: "En el contexto de una conexión HTTPS, ¿para qué se utiliza principalmente el cifrado asimétrico?",
            answerOptions: [
                { text: "Para cifrar todo el flujo de datos (videos, imágenes, texto) durante toda la navegación.", isCorrect: false },
                { text: "Para comprimir los archivos del servidor y que la página cargue más rápido.", isCorrect: false },
                { text: "Para intercambiar de forma segura una clave simétrica temporal entre el cliente y el servidor.", isCorrect: true },
                { text: "Para ocultar la dirección IP del usuario frente a posibles rastreadores externos.", isCorrect: false }
            ],
            rationale: "Se aprovecha la seguridad de las llaves pública/privada para acordar una clave simétrica que luego cifrará la sesión rápidamente.",
            hint: "Recuerda que este tipo de cifrado es muy seguro pero 'pesado' computacionalmente."
        },
        {
            questionNumber: 3,
            question: "¿Qué propiedad fundamental garantiza un algoritmo de Hash como SHA-256?",
            answerOptions: [
                { text: "Confidencialidad: permite que solo el receptor pueda leer el mensaje original.", isCorrect: false },
                { text: "Integridad: permite verificar que los datos no han sido modificados.", isCorrect: true },
                { text: "Velocidad: permite enviar archivos grandes en menos tiempo.", isCorrect: false },
                { text: "Escalabilidad: permite conectar miles de servidores de forma simultánea.", isCorrect: false }
            ],
            rationale: "Cualquier cambio mínimo en el archivo original genera un hash completamente distinto, delatando la alteración.",
            hint: "El hash es como una 'huella digital' de un archivo."
        },
        {
            questionNumber: 4,
            question: "Un certificado X.509 es fundamental en la web. ¿Qué elemento CRÍTICO contiene para que la comunicación pueda iniciarse?",
            answerOptions: [
                { text: "La clave privada del servidor web.", isCorrect: false },
                { text: "El historial de todas las contraseñas que han pasado por ese servidor.", isCorrect: false },
                { text: "La clave pública del servidor vinculada a su identidad.", isCorrect: true },
                { text: "Un algoritmo que genera dinero mediante minería de criptomonedas.", isCorrect: false }
            ],
            rationale: "El certificado sirve para que el navegador obtenga la clave pública legítima del sitio para iniciar el cifrado.",
            hint: "Piensa en qué parte del par de llaves asimétricas es seguro distribuir a todo el mundo."
        },
        {
            questionNumber: 5,
            question: "¿Qué sucede durante el paso de 'Validación' en el Handshake de HTTPS?",
            answerOptions: [
                { text: "El servidor comprueba si el usuario tiene una suscripción activa al sitio web.", isCorrect: false },
                { text: "El navegador verifica si el certificado del servidor está firmado por una Autoridad de Certificación (CA) de confianza.", isCorrect: true },
                { text: "El servidor escanea el ordenador del cliente en busca de virus antes de dejarle entrar.", isCorrect: false },
                { text: "Se comprueba si la conexión a internet es lo suficientemente rápida para soportar el cifrado.", isCorrect: false }
            ],
            rationale: "El navegador utiliza su lista interna de certificados raíz para asegurar que el certificado del servidor es auténtico.",
            hint: "Imagina una cadena de favores donde confías en alguien porque un amigo común (la CA) responde por él."
        },
        {
            questionNumber: 6,
            question: "Si un atacante intercepta una comunicación cifrada ÚNICAMENTE con algoritmos simétricos y logra robar la clave, ¿qué ocurre?",
            answerOptions: [
                { text: "Nada, porque todavía necesita la clave privada del servidor para descifrar los datos.", isCorrect: false },
                { text: "Puede descifrar todos los mensajes enviados con esa clave.", isCorrect: true },
                { text: "El sistema detecta automáticamente el robo y cambia la clave por otra nueva.", isCorrect: false },
                { text: "Los mensajes se borran automáticamente para evitar que el atacante los lea.", isCorrect: false }
            ],
            rationale: "Al ser la misma clave para cifrar y descifrar, su compromiso rompe totalmente la seguridad de la comunicación.",
            hint: "Recuerda que 'simétrico' significa que emisor y receptor comparten la misma y única herramienta."
        },
        {
            questionNumber: 7,
            question: "¿Cuál es la función de los 'Certificados Raíz' en tu sistema operativo o navegador?",
            answerOptions: [
                { text: "Acelerar la descarga de imágenes en sitios web seguros.", isCorrect: false },
                { text: "Servir como el primer eslabón de confianza para validar cualquier otro certificado de la web.", isCorrect: true },
                { text: "Almacenar el historial de navegación de forma cifrada.", isCorrect: false },
                { text: "Permitir al usuario crear sus propios certificados válidos para bancos.", isCorrect: false }
            ],
            rationale: "Son el ancla de la jerarquía; si confiamos en la Raíz, confiamos en lo que ella firma (directa o indirectamente).",
            hint: "Piensa en ellos como la 'Constitución' o ley máxima de la que emanan todos los demás permisos."
        },
        {
            questionNumber: 8,
            question: "¿En qué se diferencia principalmente TLS de SSL?",
            answerOptions: [
                { text: "SSL es para ordenadores y TLS es solo para dispositivos móviles.", isCorrect: false },
                { text: "TLS es la versión más moderna, segura y eficiente que ha sustituido al antiguo SSL.", isCorrect: true },
                { text: "SSL cifra el texto y TLS cifra las imágenes.", isCorrect: false },
                { text: "No hay diferencia; son exactamente el mismo protocolo con nombres distintos.", isCorrect: false }
            ],
            rationale: "SSL tiene vulnerabilidades conocidas y ya no se considera seguro; TLS es el estándar actual en la industria.",
            hint: "Aunque solemos decir 'certificado SSL', casi siempre nos referimos realmente a su sucesor."
        },
        {
            questionNumber: 9,
            question: "¿Por qué el cifrado de Curva Elíptica (ECC) se está volviendo más popular que RSA?",
            answerOptions: [
                { text: "Porque es mucho más fácil de entender para los programadores principiantes.", isCorrect: false },
                { text: "Porque ofrece la misma seguridad que RSA pero con llaves mucho más pequeñas.", isCorrect: true },
                { text: "Porque RSA solo funciona en sistemas operativos muy antiguos.", isCorrect: false },
                { text: "Porque ECC es el único algoritmo que no puede ser hackeado por ordenadores cuánticos.", isCorrect: false }
            ],
            rationale: "Llaves más cortas significan menos consumo de batería, menos ancho de banda y mayor velocidad en móviles.",
            hint: "Menos es más: piensa en la eficiencia de los dispositivos móviles."
        },
        {
            questionNumber: 10,
            question: "En una Firma Digital, ¿qué se cifra con la llave PRIVADA del emisor?",
            answerOptions: [
                { text: "El documento completo original.", isCorrect: false },
                { text: "El hash del documento.", isCorrect: true },
                { text: "La clave pública del receptor.", isCorrect: false },
                { text: "El nombre y apellidos del remitente en texto plano.", isCorrect: false }
            ],
            rationale: "Al cifrar el resumen (hash), se crea una firma que demuestra que el autor posee la llave privada y que el texto no cambió.",
            hint: "Combinamos la integridad del hash con la autenticidad de la llave privada."
        }
    ];

    let currentQuestionIndex = 0;
    let userAnswers = Array(quizData.length).fill(null);
    let score = 0;

    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');
    const questionSection = document.getElementById('questionSection');
    const prevButton = document.getElementById('prevButton');
    const nextButton = document.getElementById('nextButton');
    const submitQuizButton = document.getElementById('submitQuiz');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const totalQuestionsDisplay = document.getElementById('totalQuestionsDisplay');

    function loadQuestion() {
        const qData = quizData[currentQuestionIndex];
        questionSection.innerHTML = `
            <div class="question-number">Pregunta ${qData.questionNumber} de ${quizData.length}</div>
            <div class="question-text">${qData.question}</div>
            <div class="options-container" id="optionsContainer">
                ${qData.answerOptions.map((option, index) => `
                    <label class="${userAnswers[currentQuestionIndex] === index ? 'selected' : ''}">
                        <input type="radio" name="question${currentQuestionIndex}" value="${index}" 
                               ${userAnswers[currentQuestionIndex] === index ? 'checked' : ''}
                               onclick="selectAnswer(${index})">
                        ${option.text}
                    </label>
                `).join('')}
            </div>
            <div class="hint"><strong>Pista:</strong> ${qData.hint}</div>
            <div id="feedbackSection" class="feedback-section" style="display:none;"></div>
        `;

        // Update navigation buttons
        prevButton.disabled = currentQuestionIndex === 0;
        nextButton.style.display = currentQuestionIndex === quizData.length - 1 ? 'none' : 'inline-block';
        submitQuizButton.style.display = currentQuestionIndex === quizData.length - 1 ? 'block' : 'none';

        if (userAnswers[currentQuestionIndex] !== null) {
            displayFeedback(userAnswers[currentQuestionIndex]);
        }
    }

    function selectAnswer(selectedIndex) {
        userAnswers[currentQuestionIndex] = selectedIndex;
        // Optionally provide immediate feedback
        displayFeedback(selectedIndex);
    }

    function displayFeedback(selectedIndex) {
        const qData = quizData[currentQuestionIndex];
        const optionsContainer = document.getElementById('optionsContainer');
        const feedbackSection = document.getElementById('feedbackSection');
        feedbackSection.style.display = 'block';

        optionsContainer.querySelectorAll('label').forEach((label, index) => {
            label.classList.remove('selected', 'correct', 'incorrect');
            label.style.pointerEvents = 'none'; // Disable further interaction
            
            const radio = label.querySelector('input[type="radio"]');
            radio.disabled = true;

            if (index === selectedIndex) {
                label.classList.add('selected');
                if (qData.answerOptions[index].isCorrect) {
                    label.classList.add('correct');
                    feedbackSection.className = 'feedback-section correct';
                    feedbackSection.innerHTML = `<strong>¡Correcto!</strong> ${qData.rationale}`;
                } else {
                    label.classList.add('incorrect');
                    feedbackSection.className = 'feedback-section incorrect';
                    feedbackSection.innerHTML = `<strong>¡Incorrecto!</strong> ${qData.rationale}`;
                    // Highlight the correct answer even if the user got it wrong
                    qData.answerOptions.forEach((option, correctIdx) => {
                        if (option.isCorrect) {
                            optionsContainer.querySelectorAll('label')[correctIdx].classList.add('correct');
                        }
                    });
                }
            } else if (qData.answerOptions[index].isCorrect) {
                label.classList.add('correct'); // Still highlight the correct one even if not selected
            }
        });
    }

    function nextQuestion() {
        if (currentQuestionIndex < quizData.length - 1) {
            currentQuestionIndex++;
            loadQuestion();
        }
    }

    function prevQuestion() {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            loadQuestion();
        }
    }

    function calculateScore() {
        score = 0;
        userAnswers.forEach((answerIndex, qIndex) => {
            if (answerIndex !== null && quizData[qIndex].answerOptions[answerIndex].isCorrect) {
                score++;
            }
        });
    }

    function submitQuiz() {
        calculateScore();
        quizScreen.style.display = 'none';
        resultScreen.style.display = 'block';
        scoreDisplay.innerText = score;
        totalQuestionsDisplay.innerText = quizData.length;
    }

    function restartQuiz() {
        currentQuestionIndex = 0;
        userAnswers = Array(quizData.length).fill(null);
        score = 0;
        quizScreen.style.display = 'block';
        resultScreen.style.display = 'none';
        loadQuestion();
    }

    // Initial load
    loadQuestion();
</script>

</body>
</html>
